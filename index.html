<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="Run social badminton sessions: rotating courts, live leaderboard, tie-break playoffs." />
    <title>Racquet Time</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Racquet Time needs JavaScript.</noscript>
    <script>
      // If an app file fails to load but the server is reachable, this offline copy is stale: drop
      // it and reload once. If the server can't be reached we're offline, so leave everything alone.
      // Saved sessions live in localStorage and are never touched.
      (function () {
        function recover() {
          try {
            if (sessionStorage.getItem('rt-recovered')) return;
            sessionStorage.setItem('rt-recovered', '1');
          } catch (err) {
            return;
          }
          var sw = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              })
            : Promise.resolve();
          var cached = self.caches
            ? caches.keys().then(function (ks) {
                return Promise.all(ks.filter(function (k) { return k.indexOf('racquet-time-') === 0; }).map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();
          Promise.all([sw, cached]).then(function () { location.reload(); });
        }
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
            fetch('/manifest.webmanifest?probe=' + Date.now(), { cache: 'no-store' })
              .then(function (res) { if (res.ok) recover(); })
              .catch(function () {});
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
